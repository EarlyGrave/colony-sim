name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-web

      - name: Download Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_CHANNEL}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}
          mkdir -p "$T"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$T"
          rm /tmp/templates.tpz /tmp/godot.zip

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests
        run: GODOT=$HOME/godot/godot tools/run_tests_sharded.sh 4

      - name: Perf budget (single process)
        run: ~/godot/godot --headless --path . res://tests/run_tests.tscn -- --filter=test_perf_budget

      - name: Export web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
